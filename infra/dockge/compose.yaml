# Healthee — Dockge stack, behind Traefik.
#
# Copy this directory's contents to the stack dir on the VPS (default
# /opt/stacks/healthee/), fill in `.env` from `.env.example`, and Dockge owns it.
# Setup + the first-run checks: infra/dockge/README.md.
#
#   db          TimescaleDB. Internal-only, never published.
#   preflight   One-shot gate on the NEW image. See "THE UPDATE BUTTON" below.
#   api         FastAPI, published on the PRIVATE interface only (see below).
#   scheduler   The nightly chain. Same image, different command.
#
# ── TRAEFIK IS ON A DIFFERENT MACHINE ────────────────────────────────
#
# ⛔ There are NO `traefik.*` labels in this file, and adding some would do nothing.
# Traefik's Docker provider reads labels from ITS OWN daemon's socket. Ours runs on
# another host, so it cannot see these containers at all — the stack would come up
# green and simply never be routed, which is the worst way to learn this.
#
# The router, the service and all four middlewares therefore live in a FILE on the
# Traefik host: `infra/traefik/healthee.yml.template`, rendered by
# `infra/traefik/render-dynamic.sh`. Traefik dials this box over the private network
# at the address published below. Both halves have to agree, so whenever you change
# HEALTHEE_BIND_ADDR here, re-render there.
#
# ── THE UPDATE BUTTON, and what it can and cannot do ────────────────────────
#
# Dockge's update control is `docker compose pull` + `docker compose up -d`, and
# nothing more. That aligns the running IMAGE with the repo. It does not run
# migrations and it does not know that a release added a required env var.
#
# `preflight` is what makes the button safe. It runs `migrate --check` on the newly
# pulled image, and `api`/`scheduler` are gated on it exiting 0:
#
#   • code-only release  → preflight passes → the button is correct, one click;
#   • schema change, or a new required var → preflight FAILS → compose stops and
#     the update is refused, with the pending migrations named in its log.
#
# A refusal is not a bug report against this file. It means the release needs the
# real deploy — backup → stop → migrate → provision role → start — which is
# `infra/deploy.sh`, runnable from Dockge's own terminal tab for this stack.
#
# ⛔ Do NOT "fix" a failing preflight by deleting it from `depends_on`. Our
# migrations are not backwards-compatible (0004 folds `user_id` into the natural
# keys; 0007 drops a DEFAULT), so the new image on the old schema does not degrade,
# it breaks — and it breaks while writing health data.
#
# ── The edge's protections are NOT here ─────────────────────────────────────
#
# The body cap, rate limit, connection cap and security headers are all on the
# Traefik host now (`infra/traefik/`), and two more — Cloudflare IP trust and
# access-log suppression — are its static config. All of it is live-fire, none of it
# is tidiness: infra/traefik/CHECKLIST.md.
#
# What that means for THIS file: the port published below has NO protection in front
# of it. Anything that can reach it skips every middleware and talks straight to the
# app. That is why the bind address is a required variable rather than a default.

# Every container gets the SAME environment, from the one `.env` Dockge edits.
#
# `env_file` rather than a 47-line `environment:` block on purpose. The listing had
# to be repeated per service and stay in step with `core/config.Settings`, and when
# it did not, the result was a var documented in the template, set on the box, and
# never received by the process — `LLM_TIMEOUT_S` shipped that way. A whole-file
# pass-through cannot drift. The `environment:` blocks below override only the few
# values that are facts about this topology rather than operator choices.
x-healthee-env: &healthee-env
  env_file: .env

x-healthee-image: &healthee-image
  # WHERE the image comes from is a deployment decision, not a property of the code,
  # so both halves are in .env:
  #
  #   HEALTHEE_IMAGE      the repository — your own GHCR namespace if you forked,
  #                       any registry you can push to, or a bare local tag if you
  #                       build on the box (see infra/dockge/README.md "Where the
  #                       image comes from").
  #   HEALTHEE_IMAGE_TAG  `main` MOVES, which is what gives the update button
  #                       something to pull; `sha-<short>` is immutable and is what
  #                       you pin to freeze a build or roll one back.
  #
  # HEALTHEE_IMAGE is REQUIRED (`:?`), with no default, deliberately. A default would
  # name somebody's namespace — and the one it would name is the upstream project's,
  # so an operator who never set it would silently deploy an image they did not build,
  # from a repository they do not control, and the stack would come up green. A
  # missing value must be a refusal, not a guess about whose code you meant to run.
  image: ${HEALTHEE_IMAGE:?set HEALTHEE_IMAGE in .env — see infra/dockge/README.md "Where the image comes from"}:${HEALTHEE_IMAGE_TAG:-main}

services:
  db:
    image: timescale/timescaledb:latest-pg17
    container_name: healthee-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - healthee-pgdata:/var/lib/postgresql/data
    # Never published to the host and never on the proxy network. The app reaches
    # it as `db` on healthee-net.
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - healthee-net

  # ── preflight ───────────────────────────────────────────────────────────
  # Runs to completion, then exits. Asks the NEW image two questions against the
  # REAL database and the REAL .env:
  #
  #   1. does the config load?  (`get_settings()` runs inside admin_connection();
  #      a new required var, or OPENROUTER_API_KEY set with a blank model id,
  #      raises here rather than in a container that already replaced the good one)
  #   2. is the schema current? (`migrate --check` — exit 1 names what is pending)
  #
  # It INSPECTS and never applies: applying would move the schema under the
  # still-running old containers with no dump taken. Enforced by a test
  # (tests/test_migrate.py::test_check_never_applies_anything), not by this comment.
  #
  # It connects as the ADMIN role — reading `schema_migrations` is the admin's job,
  # the same identity the real migration runs as.
  preflight:
    <<: [*healthee-image, *healthee-env]
    container_name: healthee-preflight
    # One-shot. Never restart it: a restart loop would turn a clear refusal into a
    # container that looks merely unhealthy.
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "-m", "healthee.db.migrate", "--check"]
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    networks:
      - healthee-net

  api:
    <<: [*healthee-image, *healthee-env]
    container_name: healthee-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      preflight:
        condition: service_completed_successfully
    environment:
      # Topology, not operator choice — set here so editing .env in Dockge's UI
      # cannot point the app at a database that is not on this network, or bind
      # it somewhere Traefik cannot reach.
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      API_HOST: 0.0.0.0
      API_PORT: 8765
    volumes:
      - healthee-geocache:/var/cache/healthee
    # ⛔ THE BIND ADDRESS IS THE SECURITY BOUNDARY OF THIS DEPLOYMENT.
    #
    # Traefik is on another machine, so the port must be reachable from there — which
    # means it cannot be 127.0.0.1. It must be THIS BOX'S PRIVATE-NETWORK IP and
    # nothing else. Required (`:?`), with no default, because every plausible default
    # is wrong in a different way:
    #
    #   0.0.0.0    publishes the API to the internet with NO TLS, NO rate limit and
    #              bearer-token auth as the only thing between a stranger and an
    #              owner's health record. Docker writes its own iptables rules AHEAD
    #              of ufw, so a ufw DENY does not save you here — the bind address is
    #              the fix, not the firewall.
    #   127.0.0.1  correct for the old same-host nginx, and unreachable for Traefik
    #              now. The stack would be healthy and the site would 502.
    #
    # Verify from a THIRD machine after deploying: connecting to <public-ip>:8765 must
    # fail, and from the Traefik host it must succeed. README has the one-liner.
    ports:
      - "${HEALTHEE_BIND_ADDR:?set HEALTHEE_BIND_ADDR to this box's PRIVATE ip — see infra/dockge/README.md}:8765:8765"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8765/healthz', timeout=2)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - healthee-net
    labels:
      # Dockge shows these in its UI. Purely informational — nothing reads them.
      - "healthee.edge=traefik on a separate host; see infra/traefik/"
      # Which network Traefik should dial — required when a container is on more
      # than one, or Traefik may pick healthee-net and never reach it.





  # ── scheduler ───────────────────────────────────────────────────────────
  # The supervised in-process job runner: the self-rescheduling loop that fires
  # correlate → recs → briefing on their daily IST timers. Same image, CMD
  # overridden to the module entrypoint.
  #
  # Gated on api being healthy, which is in turn gated on preflight — so the
  # scheduler cannot come up against a schema the preflight refused.
  scheduler:
    <<: [*healthee-image, *healthee-env]
    container_name: healthee-scheduler
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    command: ["python", "-m", "healthee.jobs.scheduler"]
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    volumes:
      # The SAME volume as the api, deliberately: the nightly re-derive resolves
      # terrain elevation for GPS tracks and the chain's retrieval uses the same
      # embedding model. Two caches would download every tile and every model twice.
      - healthee-geocache:/var/cache/healthee
    # Not on the proxy network. It serves nothing and must not be routable.
    networks:
      - healthee-net

volumes:
  healthee-pgdata:
  # Public geodata only — SRTM elevation tiles, basemap tiles, and the 69 MB query
  # embedding model. Nothing in here is an owner's data; losing it costs a
  # re-download rather than a measurement. It exists because NOT having it cost that
  # re-download on every single container restart.
  healthee-geocache:

networks:
  healthee-net:
    driver: bridge
